name: maharashtra_tyres
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  http: ^1.2.0
  image_picker: ^1.2.3
  share_plus: ^13.2.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "web/icons/maha_tyre_app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - lib/widgets/maha_tyre_logo.png
